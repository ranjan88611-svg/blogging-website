{% extends 'base.html' %}
{% block content %}
  <div class="container">
    <div class="card">
      <h2>{% if form.instance.pk %}Edit Post{% else %}New Post{% endif %}</h2>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top:0.5rem"><button class="btn" type="submit">Save</button></div>
      </form>
    </div>
  </div>
{% endblock %}
