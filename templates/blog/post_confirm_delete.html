{% extends 'base.html' %}
{% block content %}
  <div class="card">
    <h2>Delete Post</h2>
    <p>Are you sure you want to delete "{{ object.title }}"?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn secondary" type="submit">Confirm Delete</button>
    </form>
  </div>
{% endblock %}
