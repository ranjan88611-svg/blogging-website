{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container">
  <div class="card" style="max-width:480px;margin:2rem auto;padding:2rem">
    <h2 style="text-align:center;margin-bottom:1.5rem">Create Account</h2>
    <p class="muted" style="text-align:center;margin-bottom:2rem">Join our community and start blogging</p>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}
      <div class="card"
        style="background:rgba(239,68,68,0.1);border-left:4px solid var(--brand-warning);margin-bottom:1rem;padding:1rem">
        {{ form.non_field_errors }}
      </div>
      {% endif %}
      {{ form.as_p }}
      <button class="btn" type="submit" style="width:100%;margin-top:1rem">Create Account</button>
    </form>
    <p class="muted" style="text-align:center;margin-top:1.5rem">
      Already have an account? <a href="{% url 'login' %}" style="font-weight:600">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
