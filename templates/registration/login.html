{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container">
  <div class="card" style="max-width:480px;margin:2rem auto;padding:2rem">
    <h2 style="text-align:center;margin-bottom:1.5rem">Welcome Back</h2>
    <p class="muted" style="text-align:center;margin-bottom:2rem">Sign in to your account to continue</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit" style="width:100%;margin-top:1rem">Login</button>
    </form>
    <p class="muted" style="text-align:center;margin-top:1.5rem">
      Don't have an account? <a href="{% url 'register' %}" style="font-weight:600">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
