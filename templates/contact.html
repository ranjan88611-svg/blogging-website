{% extends 'base.html' %}
{% block title %}Contact Us{% endblock %}
{% block content %}
<div class="container">
  <div class="card" style="max-width:720px;margin:2rem auto;padding:2rem">
    <h2 style="text-align:center;margin-bottom:1rem">Get In Touch</h2>
    <p class="muted" style="text-align:center;margin-bottom:2rem">Have questions or feedback? We'd love to hear from
      you.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit" style="width:100%;margin-top:1rem">📧 Send Message</button>
    </form>
  </div>
</div>
{% endblock %}
