{% extends 'base.html' %}
{% block content %}
  <div class="container">
    <div class="card" style="max-width:720px;margin:0 auto">
      <h2>Contact</h2>
      <p class="muted">If you have questions or feedback, send us a message below.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top:0.5rem"><button class="btn" type="submit">Send</button></div>
      </form>
    </div>
  </div>
{% endblock %}
